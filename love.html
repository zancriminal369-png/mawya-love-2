<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>I Love You Bou ❤</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes:wght@400&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0;background:#05010a;overflow:hidden;height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Poppins'}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%, #2a0a2a 0%, #1a0530 30%, #05010a 80%)}
.scene{position:relative;z-index:2;text-align:center;padding:15px;width:100%;max-width:400px}
.heart3d{width:120px;height:108px;position:relative;margin:0 auto 20px;animation:beat3d 1s infinite ease-in-out;filter:drop-shadow(0 0 20px #ff2d75) drop-shadow(0 0 40px #ff2d75);transform-style:preserve-3d}
.heart3d:before,.heart3d:after{content:"";position:absolute;width:60px;height:96px;background:linear-gradient(180deg,#ff4d8d,#ff0a54);border-radius:60px 60px 0 0;box-shadow:inset -5px -5px 15px rgba(0,0,0,0.4), inset 5px 5px 10px rgba(255,255,255,0.3)}
.heart3d:before{left:60px;transform:rotate(-45deg);transform-origin:0 100%}
.heart3d:after{left:0;transform:rotate(45deg);transform-origin:100% 100%}
@keyframes beat3d{0%{transform:scale(1) rotateX(10deg)}20%{transform:scale(1.15) rotateX(-10deg)}40%{transform:scale(0.95) rotateX(10deg)}60%{transform:scale(1.1) rotateX(-5deg)}100%{transform:scale(1) rotateX(10deg)}}
h1{font-family:'Great Vibes';font-size:56px;color:#ff8fab;text-shadow:0 0 20px #ff2d75,0 0 40px #ff2d75;margin-top:10px;line-height:1.1}
.sub{color:#ffd1dc;font-size:14px;margin:10px 0 20px;letter-spacing:1px;opacity:0.9}
.btns{display:flex;gap:10px;justify-content:center;margin-top:25px}
.btns a{padding:12px 26px;border-radius:30px;text-decoration:none;font-size:12px;font-weight:600;letter-spacing:0.5px}
.back{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:white;backdrop-filter:blur(10px)}
.next{background:linear-gradient(90deg,#ff0a54,#ff5d8f);color:white;box-shadow:0 0 25px rgba(255,10,84,0.6)}
.particle{position:fixed;bottom:-20px;pointer-events:none;z-index:5;animation:rise linear forwards}
@keyframes rise{0%{transform:translateY(0) translateX(0) scale(0.5) rotate(0deg);opacity:0}10%{opacity:1}100%{transform:translateY(-110vh) translateX(var(--x)) scale(1.2) rotate(360deg);opacity:0}}
.ring{position:absolute;left:50%;top:50%;border:1px solid rgba(255,100,150,0.15);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.r1{width:200px;height:200px;animation:pulseRing 2s infinite}
.r2{width:300px;height:300px;animation:pulseRing 2s infinite 0.5s}
.r3{width:400px;height:400px;animation:pulseRing 2s infinite 1s}
@keyframes pulseRing{0%{transform:translate(-50%,-50%) scale(0.8);opacity:0.8}100%{transform:translate(-50%,-50%) scale(1.3);opacity:0}}
@media(max-width:380px){h1{font-size:48px}.heart3d{width:100px;height:90px}.heart3d:before,.heart3d:after{width:50px;height:80px}.heart3d:before{left:50px}}
</style>
</head>
<body>
<div class="bg"></div>
<div style="position:fixed;left:50%;top:45%;transform:translate(-50%,-50%)">
<div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
</div>
<div class="scene">
<div class="heart3d"></div>
<h1>I Love You<br>Bou ❤</h1>
<p class="sub">Tumi amar sob, amar koliza</p>
<div class="btns">
<a href="final.html" class="back">← BACK</a>
<a href="quiz.html" class="next">NEXT →</a>
</div>
</div>
<script>
setInterval(()=>{
 const e=document.createElement('div');e.className='particle';
 const types=['❤','💖','💕','🌹','✨','💝','🥰'];
 e.innerText=types[Math.floor(Math.random()*types.length)];
 e.style.left=Math.random()*100+'vw';
 e.style.fontSize=(14+Math.random()*22)+'px';
 e.style.setProperty('--x',(Math.random()*200-100)+'px');
 e.style.animationDuration=(3+Math.random()*4)+'s';
 e.style.filter='drop-shadow(0 0 6px #ff4d8d)';
 document.body.appendChild(e);
 setTimeout(()=>e.remove(),7000);
},180);
</script>
</body>
</html>
