<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Bou ❤</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100dvh;background:#020211;overflow:hidden;display:flex;justify-content:center;align-items:center;font-family:'Poppins',sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a0a14 0%,#05030a 60%,#020211 100%);z-index:0}
#canvas{position:fixed;inset:0;z-index:2}
.center-text{position:fixed;z-index:5;text-align:center;pointer-events:none;top:50%;left:50%;transform:translate(-50%,-50%)}
.center-text h1{font-family:'Great Vibes';font-size:clamp(38px,10vw,62px);color:white;text-shadow:0 0 20px #ff4d6d,0 0 50px #ff1a4d;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.btns{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:12px}
.btns a{padding:12px 26px;border-radius:30px;text-decoration:none;font-size:12px;letter-spacing:1px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:white;backdrop-filter:blur(10px)}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="canvas"></canvas>
<div class="center-text"><h1>I Love You<br>Bou ❤</h1></div>
<div class="btns">
  <a href="final.html">← BACK</a>
  <a href="quiz.html" style="background:linear-gradient(90deg,#ff4d6d,#ff8fab);border:none;font-weight:bold">NEXT →</a>
</div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let W,H,hearts=[],angle=0;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
window.addEventListener('resize',resize);resize();
const text="I LOVE YOU Bou ❤ ";
class Particle{
  constructor(i,total){this.i=i;this.total=total;this.baseAngle=(i/total)*Math.PI*2}
  update(){
    const t=this.baseAngle+angle;
    const scale=Math.min(W,H)*0.38;
    const hx=16*Math.pow(Math.sin(t),3);
    const hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    this.x=W/2+hx*scale/16;
    this.y=H/2+hy*scale/16;
    this.char=text[this.i%text.length];
  }
  draw(){
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.baseAngle+angle);
    ctx.font=`14px Poppins`;ctx.fillStyle=`hsl(340,100%,70%)`;ctx.shadowBlur=12;ctx.shadowColor='#ff4d6d';
    ctx.fillText(this.char,0,0);ctx.restore();
  }
}
const total=180;
for(let i=0;i<total;i++)hearts.push(new Particle(i,total));
function animate(){ctx.clearRect(0,0,W,H);angle+=0.008;hearts.forEach(p=>{p.update();p.draw()});requestAnimationFrame(animate)}
animate();
</script>
</body>
</html>
