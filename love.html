<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Bou ❤</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0f172a;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at top,#1e293b 0%,#0f172a 60%)}
.heart{position:absolute;width:100px;height:90px;animation:beat 1.2s infinite}
.heart:before,.heart:after{content:"";position:absolute;width:50px;height:80px;background:#ff4d6d;border-radius:50px 50px 0 0}
.heart:before{left:50px;transform:rotate(-45deg);transform-origin:0 100%}
.heart:after{left:0;transform:rotate(45deg);transform-origin:100% 100%}
@keyframes beat{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.box{text-align:center;position:relative;z-index:2}
h1{font-family:'Great Vibes';font-size:64px;color:#ff8fab}
p{font-family:'Poppins';color:white}
a{font-family:'Poppins';padding:12px 30px;border-radius:30px;text-decoration:none;margin:10px;display:inline-block}
.back{background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.2)}
.next{background:linear-gradient(90deg,#ff4d6d,#ff8fab);color:white;font-weight:bold}
.float{position:fixed;inset:0;pointer-events:none}
.ef{position:absolute;bottom:-20px;animation:up linear forwards}
@keyframes up{to{transform:translateY(-120vh)}}
</style>
</head>
<body>
<div class="bg"></div><div class="float" id="f"></div>
<div class="box">
<div class="heart" style="left:50%;top:30%;transform:translate(-50%,-50%)"></div>
<h1 style="margin-top:140px">I Love You Bou ❤</h1>
<p>You are my everything</p>
<div style="margin-top:25px"><a href="final.html" class="back">← BACK</a><a href="quiz.html" class="next">NEXT SURPRISE →</a></div>
</div>
<script>
setInterval(()=>{
 const e=document.createElement('div');e.className='ef';
 e.innerText=['❤','💖','🌹','✨','💕'][Math.floor(Math.random()*5)];
 e.style.left=Math.random()*100+'vw';e.style.fontSize=20+Math.random()*20+'px';
 e.style.animationDuration=3+Math.random()*3+'s';
 document.getElementById('f').appendChild(e);
 setTimeout(()=>e.remove(),6000);
},300);
</script>
</body>
</html>
