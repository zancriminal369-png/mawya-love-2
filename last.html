<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forever Yours Bou ?</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0;background:#020211;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Poppins',sans-serif;overflow:hidden;text-align:center;padding:20px}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a1033 0%,#020211 85%);z-index:0}
.content{position:relative;z-index:5}
h1{font-family:'Great Vibes';font-size:clamp(42px,10vw,68px);color:#ff8fab;line-height:1.1;text-shadow:0 0 20px #ff4d6d,0 0 50px #ff1a4d;animation:beat 1.3s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
p{color:rgba(255,255,255,0.6);font-size:13px;margin-top:18px;letter-spacing:1px}
a.btn{display:inline-block;margin-top:28px;padding:16px 44px;border-radius:50px;background:linear-gradient(90deg,#ff4d6d,#ff8fab);color:white;text-decoration:none;font-weight:700;box-shadow:0 12px 35px rgba(255,77,109,0.5)}
.emoji{position:fixed;bottom:-30px;pointer-events:none;z-index:10;animation:up linear forwards}
@keyframes up{0%{transform:translateY(0) scale(0.5);opacity:0}15%{opacity:1}100%{transform:translateY(-120vh) scale(1.6);opacity:0}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="content">
<h1>Will You Be Mine<br>Forever Bou? ???</h1>
<p>I Love You More Than Words Can Say<br>You Are My Everything</p>
<a href="index.html" class="btn">Replay Our Love Story ?</a>
</div>
<script>
setInterval(()=>{
  const el=document.createElement('div');el.className='emoji';
  el.innerText=['?','??','??','??','??','??'][Math.floor(Math.random()*6)];
  el.style.left=Math.random()*95+'vw';
  el.style.fontSize=(18+Math.random()*20)+'px';
  el.style.animationDuration=(5+Math.random()*4)+'s';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),9000);
},280);
</script>
</body>
</html>
