<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our First Meet</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0;background:#020211;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Poppins';overflow:hidden;padding:15px}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at top,#1a1033 0%,#020211 80%);z-index:0}
.card{position:relative;z-index:5;width:100%;max-width:380px;text-align:center}
h1{font-family:'Great Vibes';font-size:38px;color:#ff8fab;margin-bottom:15px}
.frame{position:relative;width:100%;height:480px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:24px;backdrop-filter:blur(15px);overflow:hidden;display:flex;justify-content:center;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.frame img{width:100%;height:100%;object-fit:cover;border-radius:24px;position:absolute;opacity:0;transform:scale(0.5) rotateY(90deg);transition:all 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275)}
.frame img.active{opacity:1;transform:scale(1) rotateY(0deg)}
.frame img.a1.active{animation:flip1 0.9s}
.frame img.a2.active{animation:zoom 0.9s}
.frame img.a3.active{animation:rotate 0.9s}
.frame img.a4.active{animation:slide 0.9s}
.frame img.a5.active{animation:heart 0.9s}
.frame img.a6.active{animation:cube 0.9s}
@keyframes flip1{0%{transform:rotateY(180deg) scale(0.5)}100%{transform:rotateY(0) scale(1)}}
@keyframes zoom{0%{transform:scale(0.2) rotate(-10deg)}100%{transform:scale(1) rotate(0)}}
@keyframes rotate{0%{transform:rotate(-180deg) scale(0.3)}100%{transform:rotate(0) scale(1)}}
@keyframes slide{0%{transform:translateX(100%) scale(0.6)}100%{transform:translateX(0) scale(1)}}
@keyframes heart{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes cube{0%{transform:rotateY(90deg) rotateX(45deg) scale(0.5)}100%{transform:rotateY(0) rotateX(0) scale(1)}}

.counter{color:rgba(255,255,255,0.5);font-size:12px;margin:14px 0 8px;letter-spacing:2px}
.btns{display:flex;gap:10px;justify-content:center;margin-top:10px}
.btn{padding:12px 32px;border-radius:30px;text-decoration:none;font-weight:700;font-size:13px;cursor:pointer;border:none}
.back{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:white}
.next{background:linear-gradient(90deg,#ff4d6d,#ff8fab);color:white;box-shadow:0 8px 25px rgba(255,77,109,0.4)}
.lock{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.5);backdrop-filter:blur(10px);border-radius:50%;width:36px;height:36px;display:flex;justify-content:center;align-items:center;font-size:16px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
<h1>Our First Meet ❤</h1>
<div class="frame" id="frame">
<img src="pic1.jpg" class="a1 active" id="p1">
<img src="pic2.jpg" class="a2" id="p2">
<img src="pic3.jpg" class="a3" id="p3">
<img src="pic4.jpg" class="a4" id="p4">
<img src="pic5.jpg" class="a5" id="p5">
<img src="pic6.jpg" class="a6" id="p6">
<div class="lock" id="lock">🔒</div>
</div>
<div class="counter" id="counter">1 / 6</div>
<div class="btns">
<a href="quiz.html" class="btn back">← BACK</a>
<button class="btn next" id="nextBtn" onclick="nextPic()">NEXT →</button>
</div>
</div>
<script>
let cur=1; const total=6;
const locks=['🔒','💖','🌹','💕','✨','❤'];
function nextPic(){
 document.getElementById('p'+cur).classList.remove('active');
 cur++;
 if(cur>total){ window.location.href='index.html'; return; }
 if(cur==total){ document.getElementById('nextBtn').innerText='REPLAY ❤'; }
 document.getElementById('p'+cur).classList.add('active');
 document.getElementById('counter').innerText=cur+' / '+total;
 document.getElementById('lock').innerText=locks[cur-1];
}
</script>
</body>
</html>
