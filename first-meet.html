<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our First Meet ❤</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+Bengali:wght@400&family=Poppins:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0;background:#0f172a;color:white;font-family:'Noto Serif Bengali',serif;padding:12px;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at top,#1e293b 0%,#0f172a 70%)}
.container{max-width:100%;margin:0 auto;position:relative;z-index:2}
.box{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);padding:18px 16px;border-radius:20px;backdrop-filter:blur(15px);margin-bottom:16px}
h1{font-family:'Great Vibes';font-size:42px;color:#ff8fab;text-align:center;margin-bottom:15px}
#story{font-size:16px;line-height:1.9;color:#e2e8f0;white-space:pre-wrap;word-break:break-word;text-align:left}
.letter{opacity:0;display:inline}.letter.show{opacity:1}
.frame-wrap{position:relative;width:100%;height:520px;display:none}
.pic{position:absolute;inset:0;opacity:0;pointer-events:none;transform:scale(0.5) rotateY(90deg);transition:all 0.9s cubic-bezier(0.175,0.885,0.32,1.275)}
.pic.active{opacity:1;pointer-events:auto;transform:scale(1) rotateY(0)}
.pic.f{width:100%;height:100%;border-radius:20px;overflow:hidden;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.p1.f{border:12px solid white;border-bottom:50px solid white;transform:rotate(-2deg);box-shadow:0 20px 40px rgba(0,0,0,0.5)}
.p2.f{border:2px solid #ff4d6d;box-shadow:0 0 30px #ff4d6d;border-radius:20px}
.p3.f{border:10px solid #ffd700;box-shadow:0 0 0 3px #b8960c;border-radius:12px}
.p4.f{border-left:18px dotted #222;border-right:18px dotted #222}
.p5.f{border:3px solid rgba(255,255,255,0.2);outline:3px solid rgba(255,255,255,0.1);outline-offset:6px;border-radius:24px}
.p6.f{border:2px solid rgba(255,255,255,0.3);box-shadow:0 20px 60px rgba(0,0,0,0.6);border-radius:24px}
.lock{position:absolute;top:10px;right:10px;width:36px;height:36px;background:rgba(0,0,0,0.6);border-radius:50%;display:flex;justify-content:center;align-items:center;z-index:10}
.btns{display:flex;gap:10px;justify-content:center;margin-top:14px}
.btn{padding:11px 26px;border-radius:25px;text-decoration:none;font-size:12px;font-family:'Poppins';border:none;cursor:pointer}
.back{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:white}
.next{background:linear-gradient(90deg,#ff4d6d,#ff8fab);color:white;font-weight:bold;box-shadow:0 8px 25px rgba(255,77,109,0.4)}
#tap{position:fixed;inset:0;background:rgba(5,1,10,0.92);z-index:99;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;cursor:pointer}
#tap h2{font-family:'Great Vibes';font-size:48px;color:#ff8fab}
.counter{color:rgba(255,255,255,0.5);font-size:12px;text-align:center;margin:12px 0;letter-spacing:3px;display:none}
</style></head><body>
<div id="tap" onclick="go()"><h2>Our First Meet ❤</h2><p style="font-family:'Poppins';font-size:13px;color:#ccc;margin-top:8px">Tomar jonno sobcheye special din</p><p style="font-family:'Poppins';font-size:10px;color:#ff8fab;border:1px solid rgba(255,143,171,0.4);padding:9px 20px;border-radius:25px;margin-top:14px">💖 TAP TO READ 💖</p></div>
<div class="bg"></div>
<div class="container">
<div class="box" id="storyBox"><h1>First Dekha ❤</h1><div id="story"></div><div class="btns" id="storyBtns" style="opacity:0;margin-top:18px"><button class="btn next" onclick="showPics()">Amader Pic Dekho →</button></div></div>

<div class="box" id="picBox" style="display:none">
<div class="frame-wrap" id="frameWrap">
<div class="pic p1 active" id="p1"><div class="f"><img src="pic1.jpg"><div class="lock">🔒</div></div></div>
<div class="pic p2" id="p2"><div class="f"><img src="pic2.jpg"><div class="lock">💖</div></div></div>
<div class="pic p3" id="p3"><div class="f"><img src="pic3.jpg"><div class="lock">🌹</div></div></div>
<div class="pic p4" id="p4"><div class="f"><img src="pic4.jpg"><div class="lock">💕</div></div></div>
<div class="pic p5" id="p5"><div class="f"><img src="pic5.jpg"><div class="lock">✨</div></div></div>
<div class="pic p6" id="p6"><div class="f"><img src="pic6.jpg"><div class="lock">❤</div></div></div>
</div>
<div class="counter" id="counter">1 / 6</div>
<div class="btns"><a href="quiz.html" class="btn back">← BACK</a><button class="btn next" id="nextBtn" onclick="nextPic()">NEXT →</button></div>
</div>
</div>
<script>
const txt=`Tomake niye joto lakbo toto kom hobe, toamke nia likle kokhono ses hobe na, trpr amader ai rlt modde onk kisu hoia gace, jak ami ogula bolte chi na, tobe jokhon ami first daklam tomk tomar oisob kotha sob ami oidin a vule gaci.

Ami jedin dakha kori tomar sate, to jawar age ami ato taired cilam jano na, ami basa thake jedin ber hoici oidin bikal 5/6 tar dik ber hoici, hoye ami sabbir vai er kace gaci trpr oikhane thake ami khalid vai er kace gaci oikhane rat 10 ;30 er dik poncai. Trpr oikhane fresh hoye khawa dawa kore gumaite at 12;30 par hoi, time ta amr valo kore mone nai, trpr ami ato excited cilam je rate gum a aste cilo na, pore gumai gaci trpr vor 4 tai utci gum thake, ute gosol kore ready hoye bose cilam trpr vai namaj pore ase amk tomar oikhane jawar rode mak bujai dilo, trpr amra 6 tar dik ber hoi, hoye bas stand a jai. Trpr bas carbe 7;30 a pore ami counter a bose cilam, trpr bas carlo trpr ami oi gat a jai jawa por feri diye par hoi, trpr tomar sate to kotha hoitecilo, trpr ami bancarampur jai trpr fordabad a jai, ami ato tired cilam jano na, trpr jokhon tomak dakhi tokon amr sob tired ses hoia jai, tomar sate auto te bose jokhon jaccilam tokhon tumi jodi amr buke hat diye dakta kotota kaptecilo, ami ai muhotto gula kohono vulte parbo na,trpr jokhon lip a kiss dei,tomar hat ta dhori, jano na ami agula mone korle chok diye pani cole ase. Agula amr life a sob thke boro sriti hoye thakbe.`;
let s=false;
function go(){
 if(s) return; s=true;
 document.getElementById('tap').style.display='none';
 let area=document.getElementById('story'); let i=0;
 function next(){
  if(i>=txt.length){document.getElementById('storyBtns').style.opacity='1';return;}
  let sp=document.createElement('span');sp.className='letter';
  if(txt[i]=='\n') sp.innerHTML='<br>';
  else sp.innerText=txt[i];
  area.appendChild(sp);
  setTimeout(()=>sp.classList.add('show'),2);
  i++; setTimeout(next,20);
 } next();
}
function showPics(){
 document.getElementById('storyBox').style.display='none';
 document.getElementById('picBox').style.display='block';
 document.getElementById('frameWrap').style.display='block';
 document.getElementById('counter').style.display='block';
}
let cur=1,total=6;
function nextPic(){
 document.getElementById('p'+cur).classList.remove('active');
 cur++;
 if(cur>total){location.href='index.html';return;}
 if(cur==total) document.getElementById('nextBtn').innerText='REPLAY ❤';
 document.getElementById('p'+cur).classList.add('active');
 document.getElementById('counter').innerText=cur+' / '+total;
}
</script></body></html>
