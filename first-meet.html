<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our First Meet</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0;background:#020211;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Poppins';padding:15px;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at top,#1e293b 0%,#0f172a 70%)}
.card{position:relative;z-index:5;width:100%;max-width:380px;text-align:center}
h1{font-family:'Great Vibes';font-size:38px;color:#ff8fab;margin-bottom:15px}
.frame-wrap{position:relative;width:100%;height:520px}
.pic{position:absolute;inset:0;opacity:0;pointer-events:none;transform:scale(0.5) rotateY(90deg);transition:all 0.9s cubic-bezier(0.175,0.885,0.32,1.275)}
.pic.active{opacity:1;pointer-events:auto;transform:scale(1) rotateY(0)}
.pic img{width:100%;height:100%;object-fit:cover}
.p1 .f{transform:rotate(-2deg);border:12px solid white;border-bottom:50px solid white;box-shadow:0 20px 40px rgba(0,0,0,0.5)}
.p2 .f{clip-path:path("M 200 450 C 50 300, 0 150, 100 100 C 150 50, 250 50, 300 100 C 400 150, 350 300, 200 450 Z");filter:drop-shadow(0 0 20px #ff4d6d)}
.p3 .f{border:2px solid #ff4d6d;box-shadow:0 0 30px #ff4d6d, inset 0 0 20px rgba(255,77,109,0.3);border-radius:20px;overflow:hidden}
.p4 .f{border-left:20px dotted #222;border-right:20px dotted #222;background:#111;border-radius:4px}
.p5 .f{border:3px solid rgba(255,255,255,0.2);outline:3px solid rgba(255,255,255,0.1);outline-offset:6px;border-radius:24px;overflow:hidden;backdrop-filter:blur(10px)}
.p6 .f{border:10px solid #ffd700;box-shadow:0 0 0 3px #b8960c, 0 20px 50px rgba(0,0,0,0.6);border-radius:12px;overflow:hidden}
.lock{position:absolute;top:12px;right:12px;width:36px;height:36px;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);border-radius:50%;display:flex;justify-content:center;align-items:center;z-index:10}
.counter{color:rgba(255,255,255,0.5);font-size:12px;margin:14px 0;letter-spacing:3px}
.btns{display:flex;gap:10px;justify-content:center}
.btn{padding:12px 28px;border-radius:30px;text-decoration:none;font-weight:700;font-size:13px;border:none;cursor:pointer}
.back{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:white}
.next{background:linear-gradient(90deg,#ff4d6d,#ff8fab);color:white;box-shadow:0 8px 25px rgba(255,77,109,0.4)}
</style></head><body>
<div class="bg"></div>
<div class="card">
<h1>Our First Meet ❤</h1>
<div class="frame-wrap">
<div class="pic p1 active" id="p1"><div class="f" style="width:100%;height:100%"><img src="pic1.jpg"><div class="lock">🔒</div></div></div>
<div class="pic p2" id="p2"><div class="f" style="width:100%;height:100%"><img src="pic2.jpg"><div class="lock">💖</div></div></div>
<div class="pic p3" id="p3"><div class="f" style="width:100%;height:100%"><img src="pic3.jpg"><div class="lock">🌹</div></div></div>
<div class="pic p4" id="p4"><div class="f" style="width:100%;height:100%"><img src="pic4.jpg"><div class="lock">💕</div></div></div>
<div class="pic p5" id="p5"><div class="f" style="width:100%;height:100%"><img src="pic5.jpg"><div class="lock">✨</div></div></div>
<div class="pic p6" id="p6"><div class="f" style="width:100%;height:100%"><img src="pic6.jpg"><div class="lock">❤</div></div></div>
</div>
<div class="counter" id="counter">1 / 6</div>
<div class="btns"><a href="quiz.html" class="btn back">← BACK</a><button class="btn next" id="nextBtn" onclick="nextPic()">NEXT →</button></div>
</div>
<script>
let cur=1,total=6;
function nextPic(){
 document.getElementById('p'+cur).classList.remove('active');
 cur++;
 if(cur>total){location.href='index.html';return;}
 if(cur==total) document.getElementById('nextBtn').innerText='REPLAY ❤';
 document.getElementById('p'+cur).classList.add('active');
 document.getElementById('counter').innerText=cur+' / '+total;
}
</script></body></html>
