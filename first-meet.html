<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Dekha</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins'}
body{background:#05010a;color:white;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,#2a0a3a 0%,#12051f 40%,#05010a 80%);z-index:0}
.box{position:relative;z-index:2;max-width:650px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
h1{font-family:'Great Vibes';font-size:44px;color:#ff8fab;text-align:center;margin-bottom:20px;animation:glow 2s infinite alternate}
@keyframes glow{from{text-shadow:0 0 10px #ff0a54}to{text-shadow:0 0 20px #ff5d8f,0 0 30px #ff0a54}}
.card{background:rgba(26,10,46,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,10,84,0.25);border-radius:22px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
#story{font-size:14px;line-height:2;color:#e9d5e9;white-space:pre-wrap;min-height:100px}
#next1{display:none;margin:25px auto 0;padding:12px 35px;background:linear-gradient(90deg,#ff0a54,#ff5d8f);color:white;border:none;border-radius:25px;font-weight:600;cursor:pointer;animation:pop 0.6s}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
#gallery{display:none}
.gallery-title{font-family:'Great Vibes';font-size:32px;color:#ff8fab;text-align:center;margin-bottom:15px}
.pic-card{margin:18px 0;background:rgba(255,255,255,0.05);border-radius:18px;overflow:hidden;border:1px solid rgba(255,10,84,0.2);opacity:0;transform:translateY(30px) scale(0.95);transition:all 0.8s cubic-bezier(0.34,1.56,0.64,1)}
.pic-card.show{opacity:1;transform:translateY(0) scale(1)}
.pic-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.pic-info{padding:12px 15px;text-align:center}
.pic-info span{color:#ff8fab;font-size:12px;letter-spacing:1px}
.heart{position:fixed;pointer-events:none;animation:floatUp 3s forwards}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-100vh) scale(1.5);opacity:0}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="box">
<div id="textSection" class="card">
<h1>First Dekha</h1>
<div id="story"></div>
<button id="next1" onclick="showGallery()">Next - Our Pics</button>
</div>

<div id="gallery">
<div class="gallery-title">Our Memories</div>
<div id="pics"></div>
<div style="text-align:center;margin-top:25px"><a href="quiz.html" style="padding:12px 35px;background:linear-gradient(90deg,#ff0a54,#ff5d8f);color:white;text-decoration:none;border-radius:25px;font-weight:600;display:inline-block">Next</a></div>
</div>
</div>

<script>
let text=`Tomake niye joto lakbo toto kom hobe, toamke nia likle kokhono ses hobe na, trpr amader ai rlt modde onk kisu hoia gace, jak ami ogula bolte chi na, tobe jokhon ami first daklam tomk tomar oisob kotha sob ami oidin a vule gaci.

Ami jedin dakha kori tomar sate, to jawar age ami ato taired cilam jano na, ami basa thake jedin ber hoici oidin bikal 5/6 tar dik ber hoici, hoye ami sabbir vai er kace gaci trpr oikhane thake ami khalid vai er kace gaci oikhane rat 10:30 er dik poncai.

Trpr oikhane fresh hoye khawa dawa kore gumaite at 12:30 par hoi, time ta amr valo kore mone nai, trpr ami ato excited cilam je rate gum a aste cilo na, pore gumai gaci trpr vor 4 tai utci gum thake, ute gosol kore ready hoye bose cilam trpr vai namaj pore ase amk tomar oikhane jawar rode mak bujai dilo, trpr amra 6 tar dik ber hoi, hoye bas stand a jai. Trpr bas carbe 7:30 a pore ami counter a bose cilam, trpr bas carlo trpr ami oi gat a jai jawa por feri diye par hoi, trpr tomar sate to kotha hoitecilo, trpr ami bancarampur jai trpr fordabad a jai, ami ato tired cilam jano na, trpr jokhon tomak dakhi tokon amr sob tired ses hoia jai, tomar sate auto te bose jokhon jaccilam tokhon tumi jodi amr buke hat diye dakta kotota kaptecilo, ami ai muhotto gula kohono vulte parbo na, trpr jokhon lip a kiss dei, tomar hat ta dhori, jano na ami agula mone korle chok diye pani cole ase. Agula amr life a sob thke boro sriti hoye thakbe.`;

let el=document.getElementById('story');
let i=0;
let total=5000;
let speed=Math.floor(total/text.length);
if(speed<7)speed=7;
function type(){
 if(i<text.length){
  el.innerHTML+=text[i];
  i++;
  setTimeout(type,speed);
 }else{
  document.getElementById('next1').style.display='block';
  setInterval(createHeart,400);
 }
}
type();

function createHeart(){
 let h=document.createElement('div');
 h.className='heart';
 h.innerHTML='❤';
 h.style.left=Math.random()*100+'vw';
 h.style.top='100vh';
 h.style.color='#ff5d8f';
 h.style.fontSize=(Math.random()*10+10)+'px';
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),3000);
}

function showGallery(){
 document.getElementById('textSection').style.display='none';
 let gal=document.getElementById('gallery');
 gal.style.display='block';
 let container=document.getElementById('pics');
 let pics=['pic1.jpg','pic2.jpg','pic3.jpg','pic4.jpg','pic5.jpg','pic6.jpg'];
 let titles=['First Look','Auto te','Hat Dhora','Lip Kiss','Miss You','My Bou'];

 pics.forEach((src,idx)=>{
  let card=document.createElement('div');
  card.className='pic-card';
  card.innerHTML=`<img src="${src}" onerror="this.style.background='linear-gradient(135deg,#1a0a2e,#ff0a54)';this.style.height='250px'"><div class="pic-info"><span>${titles[idx]} ❤</span></div>`;
  container.appendChild(card);
  setTimeout(()=>{card.classList.add('show'); createHeart();}, idx*600);
 });
 window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
