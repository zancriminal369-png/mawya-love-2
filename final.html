<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You Mawya ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Hind+Siliguri:wght@300;400;500&family=Baloo+Da+2:wght@400;500&family=Poppins:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0; background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); color:white; font-family:'Baloo Da 2','Hind Siliguri', sans-serif; min-height:100vh; padding:15px; overflow-x:hidden;}
.bg-blur{position:fixed; top:-100px; left:-100px; width:400px; height:400px; background:#ff4d6d; filter:blur(120px); opacity:0.15; border-radius:50%; z-index:0;}
.container{max-width:680px; margin:0 auto; position:relative; z-index:2;}
.box{background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1); padding:28px 22px; border-radius:24px; backdrop-filter:blur(20px); margin-top:15px; box-shadow:0 20px 50px rgba(0,0,0,0.4); position:relative; overflow:hidden; min-height:500px;}
h1{font-family:'Great Vibes', cursive; font-size:52px; color:#ff8fab; text-align:center; margin-bottom:20px; position:relative; z-index:5; opacity:0; animation: fadeDown 1s ease forwards;}
@keyframes fadeDown{from{opacity:0; transform:translateY(-20px)} to{opacity:1; transform:translateY(0)}}
.divider{height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); margin:25px 0; position:relative; z-index:5; opacity:0;}
.buttons{display:flex; gap:12px; justify-content:center; margin-top:25px; position:relative; z-index:5; opacity:0;}
.buttons.show{animation: fadeUp 0.8s ease forwards;}
@keyframes fadeUp{from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)}}
.buttons a{padding:12px 30px; border-radius:30px; text-decoration:none; font-size:13px; font-family:'Poppins',sans-serif;}
a.back{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:white;}
a.next{background:linear-gradient(90deg,#ff4d6d,#ff8fab); color:white; font-weight:bold;}

.story-lines{position:relative; z-index:5;}
.line{opacity:0; transform:translateY(30px) translateX(-20px); transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); line-height:2.1; font-size:17px; font-weight:400; margin-bottom:14px; text-align:justify; color:#e2e8f0; position:relative; padding-left:28px;}
.line.show{opacity:1; transform:translateY(0) translateX(0);}
.line::before{content:'🕊️'; position:absolute; left:0; top:0; font-size:14px; opacity:0; transition:0.5s;}
.line.show::before{opacity:1;}

.bird{position:fixed; font-size:18px; z-index:10; pointer-events:none; animation: birdFly 1.2s ease-in-out forwards;}
@keyframes birdFly{
  0%{transform:translate(-50px, 100vh) rotate(20deg); opacity:0}
  20%{opacity:1}
  100%{transform:translate(var(--tx), var(--ty)) rotate(-10deg); opacity:0}
}

.float-container{position:fixed; inset:0; pointer-events:none; z-index:10; overflow:hidden;}
.heart{position:absolute; bottom:-30px; animation: floatUp linear infinite; z-index:10;}
@keyframes floatUp{0%{transform:translateY(0) rotate(0deg) scale(0.6); opacity:0} 10%{opacity:1} 100%{transform:translateY(-115vh) rotate(360deg) scale(1.4); opacity:0}}

#tapOverlay{position:fixed; inset:0; background:rgba(2,2,17,0.92); z-index:100; display:flex; flex-direction:column; justify-content:center; align-items:center; backdrop-filter:blur(10px); cursor:pointer;}
#tapOverlay h2{font-family:'Great Vibes'; font-size:55px; color:#ff8fab; margin-bottom:15px; animation: pulse 1.5s infinite;}
@keyframes pulse{0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)}}
</style>
</head>
<body>

<div id="tapOverlay" onclick="startLove()">
<h2>My Love Mawya ❤️</h2>
<p style="font-family:'Poppins'; letter-spacing:3px; font-size:12px; color:rgba(255,255,255,0.7);">TAP TO FEEL MY LOVE 💖</p>
<p style="margin-top:15px; font-size:20px;">🎵🦋✨</p>
</div>

<div class="bg-blur"></div>
<div class="float-container" id="floatContainer"></div>

<audio id="bgMusic" loop preload="auto">
  <source src="https://cdn.pixabay.com/audio/2024/09/19/audio_b9bd4170e3.mp3" type="audio/mpeg">
</audio>

<div class="container">
<div class="box">
<h1>For You Mawya ❤️</h1>
<div class="story-lines" id="storyLines"></div>
<div class="divider" id="divider"></div>
<div class="buttons" id="btns">
<a href="index.html" class="back">← BACK</a>
<a href="next.html" class="next">SEE PICS →</a>
</div>
</div>
</div>

<script>
const fullStory = `Amader first kotha hoi facebook a , ami tokhon onk besi free fire khaltam , saradin sararat mane ami jonkhon phone hate nitam tokho sudu free fire khaltam . To akdin ami facebook a amnni dukci duke amnni scole korteci , to hotat tomar mahi id ta amr samne ase , ami amr fd mahi vebe frd requst dei , to trpr pordin naki sedin a tumi accept koro , to first masses ami tomk dei , trpr tomar sate ami kotha bola suru kori , tomar sate kotha bole tokhon valoii lagcilo , pagolder moto ans dicila , trpr avabe amr sate amr protidin kotha hoi , ter maje tumi tomar real id amk deo oita teo frd koro amk . Er por hotat amader 3-4 din kotha hoi na , pore ami jokhon tomak masses dite jai dakhi tumi amk mahi id thake block kore dico , to amr tokhon mone cilo na je tomar ar akta id amr kace ace, trpr ami ar kisu kori nai , pore oidin rate ami game khalar jono dukci but sei somoy amr mb ses hoia gace . Trpr ami gumanor jonno suia cilam but gum astecilo na , pore ami phone hate niye massenger duki , trpr ami amnni id daktecilam amr frd der , to hotat tomar real id ta dakhi , ar tohon tumi online a , ami sate sate tomk masses dei . Tumi amk replyeo ditecila tobe late kore , pore tomar sate onk kotha hoi , trpr ami tomar pic caicilam . Tumi bolcila pic diye ki korben ami bolcilam kisu na just dakbo , dakhe delete kore dibo . Tokhon tumi ditecila na . Trpr ak porjaye ami tomake propose kore dei . Tumi obak hoicila . Trpr tumio ragi hao onk kosto korar por . Trpr tumi bolcila kal pic diba , pore amk gumai jaite bolcila . Ami oi din rate kivabe je gumaici ami ajo jani na . Ami ki gumaicilam naki gumai nai allah valo jane , ami ato beshi excited cilam . Trpr tumi bolcila sokal 7 tai amk pic diba mae gum thake ute . ar akta kotha bolte vule gaci , jokhon ami tomk propose kori trpr ami bolcilam ami apnke valobashi , apnake bia korbo agula boltecilam , tumi tokhon video daktecila , to amk bolteco apni jan to amk valo kore video dakte den , ami to obk hoia gacilam tomar kotha sunhe . Pore ami bolcilam je ami aikhane amar life nia kotha bolteci ar apni video nia asen . To trpr sokal a ami tomar jonno wait kortecilam je tumi kohono asba ,trpr tumi 8:30 dik online a aso , to tokhon amr test exam coltecilo , ami school jawar jonno ready hoia tomar jonno phone hate nia boae cilam ,trpr tumi online aso , ami tokhon ato happy hoicilam jano na . Trpr tomar sate kotha hoi trpr ami boli pic dawar kotha cilo akon den . Tumi bolcila pic dia jodi kisu koren , jano na tumi agula bolcila amr rag o hoccilo aber hasio paccilo , trpr tumi amk tomar pic deo ami valo kore dakhi na tate tumi delete kore dao . Tumi amk bolcila je save kore rakben na , kintu ami save kore rakcilam . tumi amk 3 ta pic deo , pic gula next page a ace . trpr ami school a jai exam dewar jonno , tumi bissas korba na amr ato kharab lagtecilo bar bar basay ase tomar sate kotha bolte mon chaccilo . Pore exam ses kore 1 secend o kothao na thake taratari basay cole acci ase tomar sate kotha bolci. avabe amader rlt suru hoi . tobe ata sotti ami toamke first propose korcilam . Tobe moja kore agula kori nai .`;

const container = document.getElementById('floatContainer');
const music = document.getElementById('bgMusic');
const storyEl = document.getElementById('storyLines');
const sentences = fullStory.split('. ').filter(s=>s.trim()!=='');
let started=false;

function startLove(){
  if(started) return; started=true;
  document.getElementById('tapOverlay').style.display='none';
  music.volume=0.6; music.play().catch(()=>{});
  showLines();
  setInterval(createFloat, 400);
}

function showLines(){
  sentences.forEach((sent, i)=>{
    const div=document.createElement('div');
    div.className='line';
    div.innerText= (sent.trim() + (sent.endsWith('.')?'':'.'));
    storyEl.appendChild(div);

    // bird animation
    setTimeout(()=>{
      const bird=document.createElement('div');
      bird.className='bird'; bird.innerText='🕊️';
      const tx = Math.random()*20+10; // target x near line
      const ty = 150 + i*30;
      bird.style.setProperty('--tx', tx+'px');
      bird.style.setProperty('--ty', ty+'px');
      bird.style.left='0px'; bird.style.top='0px';
      document.body.appendChild(bird);
      setTimeout(()=>bird.remove(), 1200);
      div.classList.add('show');
    }, i*450);
  });

  setTimeout(()=>{
    document.getElementById('divider').style.opacity='1';
    document.getElementById('divider').style.animation='fadeDown 0.8s forwards';
    document.getElementById('btns').classList.add('show');
  }, sentences.length*450 + 500);
}

function createFloat(){
  const el=document.createElement('div');
  el.className='heart';
  const emojis=['❤️','💖','💕','🌸','🌹','🦋','💗'];
  el.innerText=emojis[Math.floor(Math.random()*emojis.length)];
  el.style.left=Math.random()*90+'vw';
  el.style.fontSize=(Math.random()*10+14)+'px';
  el.style.animationDuration=(Math.random()*3+5)+'s';
  container.appendChild(el);
  setTimeout(()=>el.remove(),8000);
}
</script>
</body>
</html>
