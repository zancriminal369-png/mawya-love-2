<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memories ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020211; color:white; font-family:'Poppins', sans-serif; min-height:100vh;}
.sky{position:fixed; inset:0; background: radial-gradient(ellipse at bottom, #1e1b4b 0%, #0f0a1e 50%, #020211 100%); z-index:-2;}
.moon{position:fixed; top:7%; right:12%; width:50px; height:50px; background:radial-gradient(circle at 30% 30%, #fff, #ddd); border-radius:50%; box-shadow:0 0 30px rgba(255,255,255,0.6);}
.container{max-width:700px; margin:0 auto; padding:25px 15px; position:relative; z-index:5;}
.header{text-align:center; margin-bottom:20px;}
.header h1{font-family:'Great Vibes', cursive; font-size:62px; color:#fff; text-shadow:0 0 20px #a78bfa;}
.header .sub{color:#c4b5fd; font-style:italic; margin-top:8px;}
.gallery{display:grid; grid-template-columns: repeat(2, 1fr); gap:14px; max-width:520px; margin:25px auto 0;}
.card{border-radius:20px; overflow:hidden; aspect-ratio:4/5; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); box-shadow:0 10px 30px rgba(0,0,0,0.5); transition:0.4s;}
.card:hover{transform:scale(1.03) rotate(1deg);}
.card img{width:100%; height:100%; object-fit:cover;}
.card:nth-child(3){grid-column: 1 / span 2; max-width:50%; margin:0 auto; width:100%;}
.buttons{display:flex; gap:15px; justify-content:center; margin-top:35px;}
.buttons a{padding:12px 32px; border-radius:30px; text-decoration:none; font-size:12px; letter-spacing:1px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:white;}
.buttons a.next{background:linear-gradient(90deg,#8b5cf6,#c084fc); border:none; font-weight:bold; box-shadow:0 0 15px rgba(139,92,246,0.5);}
@media(max-width:600px){.gallery{max-width:340px} .card:nth-child(3){max-width:49%} .header h1{font-size:52px}}
</style>
</head>
<body>
<div class="sky"></div>
<div class="moon"></div>
<div class="container">
  <div class="header">
    <h1>Memories</h1>
    <p class="sub">tumi amke first agula picture dicila ❤️</p>
  </div>
  <div class="gallery">
    <div class="card"><img src="1.jpg"></div>
    <div class="card"><img src="2.jpg"></div>
    <div class="card"><img src="3.jpg"></div>
  </div>
  <div class="buttons">
    <a href="final.html">← BACK</a>
    <a href="index.html" class="next">NEXT →</a>
  </div>
</div>
</body>
</html>
