<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0; background:#0f172a; min-height:100vh; padding:20px; perspective:1200px; font-family:'Poppins', sans-serif;}
.bg-3d{position:fixed; inset:0; z-index:0; background: radial-gradient(ellipse at center, #1e293b 0%, #0f172a 70%);}
.float{position:fixed; inset:0; pointer-events:none; z-index:5;}
.emoji{position:absolute; bottom:-30px; animation: up 7s linear forwards;}
@keyframes up{0%{transform:translateY(0) scale(0.5); opacity:0} 15%{opacity:1} 100%{transform:translateY(-120vh) scale(1.5); opacity:0}}
.container{max-width:700px; margin:0 auto; position:relative; z-index:2;}
h1{font-family:'Great Vibes', cursive; font-size:55px; color:#ff8fab; text-align:center; margin:20px 0 35px; text-shadow:0 0 25px rgba(255,143,171,0.6);}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-bottom:30px;}
@media(max-width:500px){.grid{gap:12px}}
.card{position:relative; transform-style:preserve-3d; animation: floatCard 6s ease-in-out infinite; transition:0.6s;}
.card:nth-child(2){animation-delay:0.7s}
@keyframes floatCard{0%,100%{transform:translateY(0) rotateY(-6deg) rotateX(4deg)} 50%{transform:translateY(-15px) rotateY(6deg) rotateX(-4deg)}}
.card:hover{transform:translateY(-10px) rotateY(0) scale(1.06) !important; z-index:10;}
.frame{background:linear-gradient(145deg, #fff, #f8f8f8); padding:10px 10px 38px 10px; border-radius:4px; box-shadow:0 25px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.05); transform:rotate(-1.5deg);}
.card:nth-child(2) .frame{transform:rotate(1.5deg);}
.frame img{width:100%; height:320px; object-fit:cover; border-radius:2px; display:block;}
@media(max-width:500px){.frame img{height:220px}}
.frame::after{content:'Mawya ❤️'; position:absolute; bottom:8px; left:50%; transform:translateX(-50%); font-family:'Great Vibes', cursive; font-size:20px; color:#ff4d6d;}
.glow{position:absolute; inset:-3px; background:linear-gradient(45deg, #ff4d6d, #ff8fab); border-radius:6px; z-index:-1; filter:blur(15px); opacity:0; transition:0.5s;}
.card:hover .glow{opacity:0.7;}
.buttons{display:flex; gap:15px; justify-content:center; margin-top:35px;}
.btn{padding:14px 32px; border-radius:30px; text-decoration:none; font-size:14px; font-weight:600;}
.back{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:white;}
.final{background:linear-gradient(90deg,#ff4d6d,#ff8fab); color:white; box-shadow:0 8px 25px rgba(255,77,109,0.4);}
</style>
</head>
<body>
<div class="bg-3d"></div>
<div class="float" id="float"></div>
<div class="container">
<h1>Our Sweet Memories 📸</h1>
<div class="grid">
  <div class="card">
    <div class="glow"></div>
    <div class="frame">
      <img src="pic1.jpg" alt="Mawya 1">
    </div>
  </div>
  <div class="card">
    <div class="glow"></div>
    <div class="frame">
      <img src="pic2.jpg" alt="Mawya 2">
    </div>
  </div>
</div>
<div class="buttons">
<a href="final.html" class="btn back">← BACK</a>
<a href="last.html" class="btn final">FINAL SURPRISE →</a>
</div>
</div>
<script>
function emoji(){
  const el=document.createElement('div'); el.className='emoji';
  el.innerText=['❤️','💖','🌹','💕','🥰','💝'][Math.floor(Math.random()*6)];
  el.style.left=Math.random()*95+'vw';
  el.style.fontSize=(18+Math.random()*15)+'px';
  el.style.animationDuration=(5+Math.random()*3)+'s';
  document.getElementById('float').appendChild(el);
  setTimeout(()=>el.remove(),8000);
}
setInterval(emoji, 400);
</script>
</body>
</html>
