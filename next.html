<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0; background:#0f172a; min-height:100vh; padding:20px; overflow-x:hidden; perspective:1200px; font-family:'Poppins', sans-serif;}
.bg-3d{position:fixed; inset:0; z-index:0; background: radial-gradient(ellipse at center, #1e293b 0%, #0f172a 70%);}
.float{position:fixed; inset:0; pointer-events:none; z-index:5;}
.emoji{position:absolute; bottom:-30px; animation: up 7s linear forwards; font-size:20px;}
@keyframes up{0%{transform:translateY(0) scale(0.5); opacity:0} 15%{opacity:1} 100%{transform:translateY(-120vh) scale(1.5); opacity:0}}

.container{max-width:800px; margin:0 auto; position:relative; z-index:2;}
h1{font-family:'Great Vibes', cursive; font-size:55px; color:#ff8fab; text-align:center; margin:20px 0 30px; text-shadow:0 0 25px rgba(255,143,171,0.6);}

.grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:30px;}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr; gap:12px}}

.card{position:relative; transform-style:preserve-3d; animation: floatCard 6s ease-in-out infinite; transition:all 0.6s ease;}
.card:nth-child(2){animation-delay:0.5s}
.card:nth-child(3){animation-delay:1s}
@keyframes floatCard{0%,100%{transform:translateY(0px) rotateY(-5deg) rotateX(5deg)} 50%{transform:translateY(-12px) rotateY(5deg) rotateX(-5deg)}}
.card:hover{transform: translateY(-10px) rotateY(0deg) scale(1.05) !important; z-index:10;}

.frame{position:relative; background:linear-gradient(145deg, #ffffff 0%, #f8f8f8 100%); padding:10px 10px 35px 10px; border-radius:4px; box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.1), inset 0 0 20px rgba(0,0,0,0.05); transform: rotate(-1deg);}
.card:nth-child(even) .frame{transform: rotate(1deg);}
.frame::before{content:''; position:absolute; inset:0; background:linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.8) 50%, transparent 70%); opacity:0; transition:0.6s; pointer-events:none; z-index:2;}
.card:hover .frame::before{opacity:1; transform:translateX(100%);}

.frame img{width:100%; height:280px; object-fit:cover; border-radius:2px; display:block; box-shadow: inset 0 0 10px rgba(0,0,0,0.2);}
@media(max-width:600px){.frame img{height:200px}}

.frame::after{content:'Mawya ❤️'; position:absolute; bottom:8px; left:50%; transform:translateX(-50%); font-family:'Great Vibes', cursive; font-size:18px; color:#ff4d6d; opacity:0.8;}

.glow{position:absolute; inset:-2px; background:linear-gradient(45deg, #ff4d6d, #ff8fab, #ff4d6d); border-radius:6px; z-index:-1; filter:blur(12px); opacity:0; transition:0.5s;}
.card:hover .glow{opacity:0.6;}

.buttons{display:flex; gap:15px; justify-content:center; margin-top:30px;}
.btn{padding:14px 32px; border-radius:30px; text-decoration:none; font-size:14px; font-weight:600; letter-spacing:0.5px;}
.back{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:white; backdrop-filter:blur(10px);}
.final{background:linear-gradient(90deg,#ff4d6d,#ff8fab); color:white; box-shadow:0 8px 25px rgba(255,77,109,0.4); animation: pulseBtn 2s infinite;}
@keyframes pulseBtn{0%{transform:scale(1)} 50%{transform:scale(1.05)} 100%{transform:scale(1)}}
</style>
</head>
<body>

<div class="bg-3d"></div>
<div class="float" id="float"></div>

<div class="container">
<h1>Our Sweet Memories 📸</h1>

<div class="grid">
  <div class="card">
    <div class="glow"></div>
    <div class="frame">
      <img src="pic1.jpg" alt="Mawya 1">
    </div>
  </div>
  <div class="card">
    <div class="glow"></div>
    <div class="frame">
      <img src="pic2.jpg" alt="Mawya 2">
    </div>
  </div>
  <div class="card">
    <div class="glow"></div>
    <div class="frame">
      <img src="pic3.jpg" alt="Mawya 3">
    </div>
  </div>
  <div class="card">
    <div class="glow"></div>
    <div class="frame">
      <img src="pic1.jpg" alt="Mawya 4" style="filter: sepia(0.3) saturate(1.2);">
    </div>
  </div>
</div>

<div class="buttons">
<a href="final.html" class="btn back">← BACK</a>
<a href="last.html" class="btn final">FINAL SURPRISE →</a>
</div>
</div>

<script>
function emoji(){
  const el=document.createElement('div'); el.className='emoji';
  el.innerText=['❤️','💖','🌹','💕','🥰','💝'][Math.floor(Math.random()*6)];
  el.style.left=Math.random()*95+'vw';
  el.style.animationDuration=(5+Math.random()*3)+'s';
  document.getElementById('float').appendChild(el);
  setTimeout(()=>el.remove(),8000);
}
setInterval(emoji, 400);
for(let i=0;i<10;i++) setTimeout(emoji, i*300);
</script>
</body>
</html>
