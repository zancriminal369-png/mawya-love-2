<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memories ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020211; color:white; font-family:'Poppins', sans-serif; min-height:100vh;}
.sky{position:fixed; inset:0; background: radial-gradient(ellipse at top, #1a2a5e 0%, #0a1128 50%, #020211 100%); z-index:-2;}
.container{max-width:700px; margin:0 auto; padding:25px 15px; position:relative; z-index:5;}
.header{text-align:center; margin-bottom:25px;}
.header h1{font-family:'Great Vibes', cursive; font-size:60px; text-shadow:0 0 20px #ff4d6d;}
.header .sub{opacity:0.9; font-size:15px; margin-top:10px; color:#ffb3c6; font-style:italic;}
.gallery{display:grid; grid-template-columns: repeat(1, 1fr); gap:16px; margin-top:20px; max-width:400px; margin-left:auto; margin-right:auto;}
.card{border-radius:18px; overflow:hidden; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); box-shadow:0 10px 30px rgba(0,0,0,0.3);}
.card img{width:100%; height:auto; object-fit:cover; display:block;}
.buttons{text-align:center; margin-top:30px; display:flex; gap:15px; justify-content:center;}
.buttons a{padding:12px 30px; border-radius:25px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:white; text-decoration:none; font-size:12px;}
.buttons a.next{background:linear-gradient(90deg,#ff4d6d,#ff8fab); border:none; font-weight:bold;}
@media(max-width:600px){.header h1{font-size:48px;} .gallery{max-width:320px;} }
</style>
</head>
<body>
<div class="sky"></div>
<div class="container">
  <div class="header">
    <h1>Memories</h1>
    <p class="sub">tumi amke first agula picture dicila ❤️</p>
  </div>
  <div class="gallery">
    <div class="card"><img src="1.jpg"></div>
    <div class="card"><img src="2.jpg"></div>
    <div class="card"><img src="3.jpg"></div>
  </div>
  <div class="buttons">
    <a href="final.html">← BACK</a>
    <a href="index.html" class="next">HOME ❤️</a>
  </div>
</div>
</body>
</html>
