<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>For Bou ❤</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+Bengali:wght@400&family=Poppins:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0;background:#0f172a;color:white;font-family:'Noto Serif Bengali',serif;padding:12px;overflow-x:hidden;-webkit-text-size-adjust:100%}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at top,#1e293b 0%,#0f172a 70%)}
.container{max-width:100%;margin:0 auto;position:relative;z-index:2}
.box{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);padding:18px 16px;border-radius:20px;backdrop-filter:blur(15px)}
h1{font-family:'Great Vibes';font-size:42px;color:#ff8fab;text-align:center;margin-bottom:15px}
#story{font-size:16px;line-height:1.9;color:#e2e8f0;white-space:pre-wrap;word-break:break-word;text-align:left}
.div{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);margin:18px 0;opacity:0}
.btns{display:flex;gap:10px;justify-content:center;opacity:0;transition:0.8s}
.btns.show{opacity:1}
.btns a{padding:11px 24px;border-radius:25px;text-decoration:none;font-size:12px;font-family:'Poppins'}
.back{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:white}
.next{background:linear-gradient(90deg,#ff4d6d,#ff8fab);color:white;font-weight:bold}
#tap{position:fixed;inset:0;background:rgba(5,1,10,0.92);z-index:99;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;cursor:pointer}
#tap h2{font-family:'Great Vibes';font-size:48px;color:#ff8fab;animation:p 1.5s infinite}
@keyframes p{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.letter{opacity:0;display:inline}
.letter.show{opacity:1}
.float{position:fixed;inset:0;pointer-events:none;z-index:10}
.ef{position:absolute;bottom:-20px;animation:up linear forwards}
@keyframes up{to{transform:translateY(-120vh)}}
@media(max-width:380px){#story{font-size:15px;line-height:1.8}h1{font-size:36px}}
</style>
</head>
<body>
<div id="tap" onclick="go()"><h2>Our Love Story ❤</h2><p style="font-family:'Poppins';font-size:13px;color:#ccc;margin-top:8px">Bou er jonno</p><p style="font-family:'Poppins';font-size:10px;color:#ff8fab;border:1px solid rgba(255,143,171,0.4);padding:9px 20px;border-radius:25px;margin-top:14px">💖 TAP TO READ 💖</p></div>
<div class="bg"></div><div class="float" id="float"></div>
<div class="container"><div class="box"><h1>For My Bou ❤</h1><div id="story"></div><div class="div" id="div"></div><div class="btns" id="btns"><a href="love.html" class="back">← BACK</a><a href="last.html" class="next">FINAL →</a></div></div></div>
<script>
const txt=`To oivabe amader rlt suru hoi, trpr amara aste aste 2 jon 2 jon ke valo kore cinte suru kori. First er dik tumi aktu kom priority ditecila amk, but amr onk valo lagtecilo. First er dik ami ja ja qustion kortecilam tumi tai ans dicila, maje maje tumio qustion kortecila. To akdin rat 1/2 er dik tomak ami ki qustion korbe ami vebe paitecilam na. Amio qustion kori na tumio koro na, prai 10/15 minite er moto, to amr onk kanna paitecilo, amr buk ta kemon jani betha kortecilo. Pore ami suite na pare tomk masses dai, dia boli tumi kotha na bolle amr onk kosto hoi kemon jani lage. Trpr tumi amr sate kotha bolo. Amra kintu tokhon akjon akjon ke koliza, bou, jamai agula bole daktam na. Amra oi bole kotha boltam. Ar tumi to apni bola cartei chao na, bar bar apni apni kore kotha bolcila amr sate. Ami jokhon boli ar apni apni bolba na tokhon tumi thik vabe tumi kore bolo, aber kisukhon por apni apni kore bolo. Trpr amr evabe onk din kotha boli, trpr hotat ami tomar nickname dai unknown, trpr tumi bolcila ata ki name dila, to pore ami change kore jan dei. Trpr ami tomk boli ata thiik ace tumi bolo hea thik ace. Tokhon tomk agula name dhore dakte voi/lojja 2 tai lagto, tomar o mone hoi lagto. To trpr ami tomk jan bole daka suru kori, trpr tumi first amr nickname deo my men, jano tumi jokhon ata deo ami ata dakhe ki je hoia gacilam. onk happy hoicilam. To trpr aste aste tomake koliza pakhi agula bole daka suru kori. Oho ar akta kahini, koliza jokhon daka suru kori to oi din ami tomke bolcilam, mane koliza bole dakar age, bolcilam manus ki koliza cara baste pare?,Tumi bolcila na. To tokhon ami bolcilam aj thake tomk ami koliza bole dakbo. Tumi bolcila acca dakio. Trpr thake ami tomk koliza bole dakhi. Jano tumi amr life a ase ami akdon change hoia gaci. Ami akdon onno rokom hoia gaci, age ami basa thake onk ber hotam, frd der sate smok kortam, sob thake beshi free fire khaltam, trpr tumi amr life a asla tokhon thake agula cere dilam tobe smok kortam but khub kom. Trpr tumi akdon tomar kocom dila je smok na korar jonno, pore oidin thake ami smok kortam na aber kisu din thake suru korci, tobe aber cere dibo. Jai hok trpr amader rlt onno rokom hoia gele amra 2 jon 2 jon ke ato kom somoy atota valobeshe feleci, ami amr ta boli ami tomk atota valobahi ja tumi kolponao korte parba na, tumi hoiteo kohono vabo nai je tomk kew atota valo basbe. Ami thik tomk tota valobashi, jotota akjon ma tar sontan ke valobashe. Ami tomke ato ato primane valobashi jar tumi kohono kono ses khuje paba na. Ami jokhon more jabo tokhon hoito toamke ar valobaste parbo na. Tobe akta sotti kota ami je poriman a tomk valobashi ai rokom kew tomake valobaste parbe na. Tobe ami caitam amor moto amke kew love koruk, amr moto amake kew love koruk, tobe allah amr kotha sunce, ami jemon meye caitam allah thik temon meye mane toamke amr life a dice. Ami thik tomar moto meye amr life a caitam, je amr sob kotha sunbe, ami ja bolbo tai korbe, se kohono amr kothar upor kono kotha bolbe na, mane ami jemon caitam tumi thik temoniiiiii tomar kono kom nai. Ami ja caici allah amk tar caite onk valo meye amk dice. Ami toamke amr life a peye amr life a sob thake boro success peye gaci.`;
let s=false;
function go(){
 if(s) return; s=true;
 document.getElementById('tap').style.display='none';
 let area=document.getElementById('story');
 let i=0;
 setInterval(()=>{
  const el=document.createElement('div');el.className='ef';
  el.innerText=['❤','💖','🌹','💕'][Math.floor(Math.random()*4)];
  el.style.left=Math.random()*100+'vw';el.style.fontSize=14+Math.random()*16+'px';
  el.style.animationDuration=3+Math.random()*3+'s';
  document.getElementById('float').appendChild(el);
  setTimeout(()=>el.remove(),6000);
 },350);
 function next(){
  if(i>=txt.length){document.getElementById('div').style.opacity='1';document.getElementById('btns').classList.add('show');return;}
  let sp=document.createElement('span');sp.className='letter';
  if(txt[i]=='\n') sp.innerHTML='<br>';
  else sp.innerText=txt[i];
  area.appendChild(sp);
  setTimeout(()=>sp.classList.add('show'),2);
  i++;
  setTimeout(next, 2);;
 }
 next();
}
</script>
</body>
</html>
