<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locked For Bou ?</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{margin:0;background:#02020f;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Poppins',sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a1033 0%,#0a0a1a 50%,#02020f 100%);z-index:0}
.stars{position:fixed;inset:0;z-index:1}
.star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:0.3}50%{opacity:1}}
.lock-wrapper{position:relative;z-index:5;text-align:center;transition:all 1.2s cubic-bezier(0.68,-0.55,0.265,1.55)}
.lock-box{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(25px);padding:45px 35px;border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.1);width:360px;max-width:90vw}
.lock-icon{font-size:70px;margin-bottom:15px;display:inline-block;animation:floatLock 3s ease-in-out infinite}
@keyframes floatLock{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-family:'Great Vibes';font-size:42px;color:#ff8fab;margin-bottom:8px}
p.sub{color:rgba(255,255,255,0.6);font-size:13px;margin-bottom:25px;letter-spacing:1px}
input{width:100%;padding:16px 20px;border-radius:50px;border:1px solid rgba(255,143,171,0.3);background:rgba(0,0,0,0.4);color:white;text-align:center;font-size:16px;letter-spacing:3px;outline:none}
.btn{width:100%;margin-top:18px;padding:15px;border-radius:50px;border:none;background:linear-gradient(90deg,#ff4d6d,#ff8fab);color:white;font-weight:700;letter-spacing:1px;cursor:pointer;box-shadow:0 10px 30px rgba(255,77,109,0.4)}
.shake{animation:shake 0.5s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#unlockScene{position:fixed;inset:0;z-index:20;background:#02020f;display:none;justify-content:center;align-items:center;flex-direction:column}
.ring{position:absolute;border:1px solid rgba(255,77,109,0.3);border-radius:50%;animation:expand 1.5s ease-out forwards}
@keyframes expand{0%{width:0;height:0;opacity:1}100%{width:200vw;height:200vw;opacity:0}}
.big-heart{font-size:120px;animation:heartBlast 1.2s cubic-bezier(0.68,-0.55,0.265,1.55) forwards}
@keyframes heartBlast{0%{transform:scale(0)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.unlock-text{font-family:'Great Vibes';font-size:52px;color:#ff8fab;margin-top:20px;opacity:0;animation:fadeUp 0.8s 0.8s forwards}
@keyframes fadeUp{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:translateY(0)}}
#picReveal{position:fixed;inset:0;z-index:25;background:radial-gradient(ellipse at center,#1e293b 0%,#0f172a 100%);display:none;padding:20px;overflow-y:auto}
.reveal-container{max-width:750px;margin:0 auto;text-align:center;padding-top:30px}
.reveal-title{font-family:'Great Vibes';font-size:58px;color:#ff8fab;opacity:0;animation:fadeUp 0.8s 0.5s forwards}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:35px 0}
.pic-card{opacity:0;transform:translateY(80px) scale(0.8);animation:cardIn 1s cubic-bezier(0.68,-0.55,0.265,1.55) forwards;position:relative}
.pic-card:nth-child(1){animation-delay:0.8s}.pic-card:nth-child(2){animation-delay:1.1s}
@keyframes cardIn{0%{opacity:0;transform:translateY(80px) scale(0.8)}100%{opacity:1;transform:translateY(0) scale(1)}}
.frame{background:white;padding:12px 12px 40px 12px;border-radius:4px;box-shadow:0 30px 60px rgba(0,0,0,0.6)}
.frame img{width:100%;height:340px;object-fit:cover;display:block}
@media(max-width:600px){.frame img{height:240px}}
.frame::after{content:'Bou ? My Love';position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-family:'Great Vibes';font-size:18px;color:#ff4d6d}
.glow{position:absolute;inset:-4px;background:linear-gradient(45deg,#ff4d6d,#ff8fab,#ff4d6d);border-radius:6px;z-index:-1;filter:blur(20px);opacity:0.6}
.nextBtn{display:inline-block;margin-top:25px;padding:16px 45px;border-radius:50px;background:linear-gradient(90deg,#ff4d6d,#ff8fab);color:white;text-decoration:none;font-weight:700;box-shadow:0 10px 30px rgba(255,77,109,0.5)}
.float{position:fixed;inset:0;pointer-events:none;z-index:30}
.emoji{position:absolute;bottom:-20px;animation:up 7s linear forwards}
@keyframes up{0%{transform:translateY(0) scale(0.5);opacity:0}15%{opacity:1}100%{transform:translateY(-120vh) scale(1.5);opacity:0}}
</style>
</head>
<body>
<div class="bg"></div><div class="stars" id="stars"></div><div class="float" id="float"></div>
<div class="lock-wrapper" id="lockWrapper"><div class="lock-box" id="lockBox"><div class="lock-icon" id="lockIcon">??</div><h1>Locked For You</h1><p class="sub">Enter the secret key</p><input type="text" id="pass" placeholder="password"><button class="btn" onclick="checkPass()">UNLOCK MY HEART ?</button><p id="err" style="color:#ff6b8a;font-size:12px;margin-top:12px;height:14px"></p></div></div>
<div id="unlockScene"><div class="big-heart">??</div><div class="unlock-text">Unlocked... For You Bou</div></div>
<div id="picReveal"><div class="reveal-container"><div class="reveal-title">My Love, Bou ?</div><div class="pics"><div class="pic-card"><div class="glow"></div><div class="frame"><img src="1.jpg"></div></div><div class="pic-card"><div class="glow"></div><div class="frame"><img src="2.jpg"></div></div></div><a href="final.html" class="nextBtn">Continue Our Story ?</a></div></div>
<script>
for(let i=0;i<80;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';s.style.animationDelay=Math.random()*3+'s';document.getElementById('stars').appendChild(s)}
function checkPass(){const p=document.getElementById('pass').value.trim().toLowerCase();if(p==='mawya'||p==='Bou2024'){unlock()}else{document.getElementById('err').innerText='Wrong password! Try Bou ?';document.getElementById('lockBox').classList.add('shake');setTimeout(()=>document.getElementById('lockBox').classList.remove('shake'),500)}}
document.getElementById('pass').addEventListener('keypress',e=>{if(e.key==='Enter')checkPass()});
function unlock(){document.getElementById('lockIcon').innerText='??';for(let i=0;i<3;i++){const r=document.createElement('div');r.className='ring';r.style.left='50%';r.style.top='50%';r.style.transform='translate(-50%,-50%)';r.style.animationDelay=i*0.2+'s';document.getElementById('unlockScene').appendChild(r)}document.getElementById('lockWrapper').style.transform='scale(1.5)';document.getElementById('lockWrapper').style.opacity='0';setTimeout(()=>{document.getElementById('lockWrapper').style.display='none';document.getElementById('unlockScene').style.display='flex';for(let i=0;i<30;i++)setTimeout(createEmoji,i*50)},600);setTimeout(()=>{document.getElementById('unlockScene').style.opacity='0';document.getElementById('unlockScene').style.transform='scale(1.5)';document.getElementById('unlockScene').style.transition='all 0.8s';setTimeout(()=>{document.getElementById('unlockScene').style.display='none';document.getElementById('picReveal').style.display='block';setInterval(createEmoji,300)},800)},2500)}
function createEmoji(){const el=document.createElement('div');el.className='emoji';el.innerText=['?','??','??','??','??','??'][Math.floor(Math.random()*6)];el.style.left=Math.random()*95+'vw';el.style.fontSize=(18+Math.random()*18)+'px';el.style.animationDuration=(5+Math.random()*3)+'s';document.getElementById('float').appendChild(el);setTimeout(()=>el.remove(),8000)}
</script>
</body>
</html>
