<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Love Mawya ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100dvh; overflow:hidden; background:#050510;
  font-family:'Poppins', sans-serif;
  display:flex; align-items:center; justify-content:center;
}
.sky{position:absolute; inset:0; background: radial-gradient(ellipse at top, #1e3c72 0%, #0f0c29 55%, #02020a 100%);}
.stars{position:absolute; inset:0; background-image: radial-gradient(1.5px 1.5px at 50px 50px, #fff, transparent), radial-gradient(1px 1px at 150px 100px, #fff, transparent); background-size:280px 280px; opacity:.7;}
.moon{position:absolute; top:6%; right:8%; width:60px; height:60px; background: radial-gradient(circle at 30% 30%, #fff, #f5f3ce); border-radius:50%; box-shadow:0 0 25px #fff, 0 0 50px rgba(255,255,255,.4);}
.mountain{position:absolute; bottom:0; width:100%; height:48%; background: linear-gradient(to top, #000 0%, #1a1a2e 100%); clip-path: polygon(0% 100%, 0% 68%, 18% 52%, 38% 38%, 62% 48%, 82% 32%, 100% 42%, 100% 100%); z-index:2;}
.mountain2{position:absolute; bottom:0; width:100%; height:38%; background:#0f0c29; clip-path: polygon(0% 100%, 0% 78%, 28% 68%, 52% 82%, 72% 62%, 100% 72%, 100% 100%); opacity:.6; z-index:1;}

/* Main Container - Mobile Friendly */
.main{
  position:relative; z-index:10; width:100%; max-width:400px; padding:20px;
  display:flex; flex-direction:column; align-items:center; text-align:center;
}

/* Couple Photo - Responsive */
.couple-frame{
  width: clamp(140px, 45vw, 180px); height: clamp(140px, 45vw, 180px);
  border-radius:50%; padding:4px;
  background: linear-gradient(45deg, #ff4d6d, #ff8fa3);
  box-shadow: 0 0 20px #ff4d6d, 0 0 40px rgba(255,77,109,.4);
  animation: floatPic 3s ease-in-out infinite;
  margin-bottom:20px;
}
.couple-frame img{
  width:100%; height:100%; border-radius:50%; object-fit:cover;
  background:#111; display:block;
}
@keyframes floatPic{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

.main h1{
  font-family:'Great Vibes', cursive; font-size: clamp(42px, 12vw, 70px);
  color:#fff; text-shadow: 0 0 15px #ff4d6d, 0 0 30px #ff4d6d;
  line-height:1.1;
}
.main p{
  color:rgba(255,255,255,.75); letter-spacing:2px; font-size: clamp(11px, 3vw, 13px);
  margin-top:8px; font-weight:300;
}

.next-btn{
  margin-top:22px; padding:12px 38px; background: rgba(255,77,109,.15);
  border:1px solid #ff8fa3; color:#ffd6e0; border-radius:30px;
  letter-spacing:2px; font-size:13px; backdrop-filter: blur(10px);
  text-decoration:none; transition:.3s; display:inline-block;
}
.next-btn:active, .next-btn:hover{ background:#ff4d6d; color:#fff; box-shadow:0 0 20px #ff4d6d; transform:scale(1.05) }

/* Jonaki */
.firefly{
  position:absolute; width:3px; height:3px; background:#ffffa6; border-radius:50%;
  box-shadow: 0 0 6px #ffff00, 0 0 12px #ffff00;
  animation: blink 1.2s ease-in-out infinite alternate;
  z-index:4;
}
@keyframes blink{ 0%{opacity:.2} 100%{opacity:1; box-shadow:0 0 10px #ffff00, 0 0 20px #ffff00} }

/* Ful - Mobile e thoka thoka + norbe */
.flowers-bed{
  position:absolute; bottom:0; left:0; width:100%; height:75px; z-index:6;
  display:flex; justify-content:space-around; align-items:flex-end;
  padding:0 5px 8px 5px; pointer-events:none;
}
.flower-bunch{
  font-size: clamp(20px, 6vw, 30px);
  animation: sway 2.2s ease-in-out infinite;
  line-height:1;
}
.flower-bunch:nth-child(2){ animation-delay:.3s }
.flower-bunch:nth-child(3){ animation-delay:.6s }
.flower-bunch:nth-child(4){ animation-delay:.9s }
@keyframes sway{ 0%,100%{transform: rotate(-6deg) translateY(0)} 50%{transform: rotate(6deg) translateY(-4px)} }

@media (max-height: 700px){
  .couple-frame{ width:120px; height:120px; margin-bottom:12px; }
  .main h1{ font-size:38px }
  .flowers-bed{ height:55px }
}
</style>
</head>
<body>
<div class="sky"></div>
<div class="stars"></div>
<div class="moon"></div>
<div class="mountain2"></div>
<div class="mountain"></div>

<div class="main">
  <div class="couple-frame">
    <img src="couple.jpg" alt="Me & Mawya">
  </div>
  <h1>My Love Mawya</h1>
  <p>YOU ARE MY WHOLE WORLD ❤️</p>
  <a href="next.html" class="next-btn">NEXT →</a>
</div>

<div class="flowers-bed">
  <div class="flower-bunch">🌷</div>
  <div class="flower-bunch">🌸💐</div>
  <div class="flower-bunch">🌹</div>
  <div class="flower-bunch">🌺🌷</div>
  <div class="flower-bunch">💐</div>
  <div class="flower-bunch">🌸</div>
</div>

<script>
// 20 ta jonaki - ure berabe + jolbe
for(let i=0;i<22;i++){
  let f=document.createElement('div');
  f.className='firefly';
  f.style.left=Math.random()*100+'vw';
  f.style.top=Math.random()*75+'vh';
  f.style.animationDelay=Math.random()*2+'s';
  // halka nora
  f.animate([
    {transform:`translate(0,0)`},
    {transform:`translate(${Math.random()*60-30}px, ${Math.random()*60-30}px)`},
    {transform:`translate(0,0)`}
  ], {duration: 4000+Math.random()*4000, iterations: Infinity});
  document.body.appendChild(f);
}
</script>
</body>
</html>
