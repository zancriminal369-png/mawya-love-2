<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mawya ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  height:100vh; overflow:hidden; background:#02020a;
  display:flex; align-items:center; justify-content:center;
  font-family:'Dancing Script', cursive;
}
.sky{
  position:absolute; width:100%; height:100%;
  background: radial-gradient(ellipse at top, #1e3c72 0%, #2a5298 20%, #0a0a23 60%, #02020a 100%);
}
.stars{
  position:absolute; width:100%; height:100%;
  background-image: 
    radial-gradient(2px 2px at 20px 30px, #fff, transparent),
    radial-gradient(2px 2px at 40px 70px, #fff, transparent),
    radial-gradient(1px 1px at 90px 40px, #fff, transparent),
    radial-gradient(1.5px 1.5px at 160px 120px, #fff, transparent),
    radial-gradient(1px 1px at 230px 190px, #fff, transparent);
  background-repeat: repeat; background-size: 250px 250px;
  animation: twinkle 4s ease-in-out infinite alternate;
}
@keyframes twinkle{ 0%{opacity:0.5} 100%{opacity:1} }

.moon{
  position:absolute; top:12%; right:15%; width:80px; height:80px;
  background: radial-gradient(circle at 30% 30%, #fff, #f5f3ce, #e6e6a8);
  border-radius:50%; box-shadow: 0 0 40px #fff, 0 0 80px #fff, 0 0 120px rgba(255,255,255,0.3);
  animation: moonGlow 4s ease-in-out infinite alternate;
}
@keyframes moonGlow{ 0%{box-shadow:0 0 30px #fff, 0 0 60px #fff} 100%{box-shadow:0 0 50px #fff, 0 0 100px #fff} }

/* Pahar */
.mountain{
  position:absolute; bottom:0; width:100%; height:55%;
  background: linear-gradient(to top, #0a0a0a 0%, #1a1a2e 100%);
  clip-path: polygon(0% 100%, 0% 60%, 15% 45%, 25% 55%, 40% 35%, 55% 50%, 70% 30%, 85% 45%, 100% 38%, 100% 100%);
  z-index:2;
}
.mountain2{
  position:absolute; bottom:0; width:100%; height:45%;
  background: linear-gradient(to top, #16213e 0%, #0f3460 100%);
  clip-path: polygon(0% 100%, 0% 70%, 20% 60%, 35% 75%, 50% 55%, 65% 65%, 80% 50%, 100% 60%, 100% 100%);
  opacity:0.7; z-index:1;
}

/* Couple Silhouette */
.couple{
  position:absolute; bottom:33%; left:50%; transform:translateX(-50%);
  width:100px; height:80px; z-index:3;
}
.couple::before{ /* meye */
  content:''; position:absolute; bottom:0; left:20px; width:25px; height:35px;
  background:#000; border-radius:15px 15px 5px 5px; box-shadow: 0 -15px 0 #000, -5px -25px 0 -3px #000;
}
.couple::after{ /* chele */
  content:''; position:absolute; bottom:0; left:50px; width:28px; height:40px;
  background:#000; border-radius:15px 15px 5px 5px; box-shadow: 0 -18px 0 #000, 5px -28px 0 -3px #000;
}
.couple-heads::before{
  content:'❤'; position:absolute; top:-15px; left:50%; transform:translateX(-50%);
  color:#ff4d6d; font-size:12px; animation: heartBeat 1.5s ease-in-out infinite;
}
@keyframes heartBeat{ 0%,100%{transform:translateX(-50%) scale(1)} 50%{transform:translateX(-50%) scale(1.3)} }

/* Text */
.content{ position:relative; z-index:10; text-align:center; margin-top:-25vh; }
.content h1{
  font-family:'Great Vibes', cursive; font-size: clamp(70px, 18vw, 130px);
  color:#fff; text-shadow: 0 0 20px #ff8fa3, 0 0 40px #ff4d6d;
  animation: fadeUp 2s ease-out, floatText 3s ease-in-out infinite 2s;
}
.content p{ color:rgba(255,255,255,0.7); letter-spacing:4px; font-size:14px; margin-top:5px; font-family:sans-serif; animation: fadeUp 2s ease-out 0.5s both; }
@keyframes fadeUp{ 0%{opacity:0; transform:translateY(40px)} 100%{opacity:1; transform:translateY(0)} }
@keyframes floatText{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

/* Projapoti */
.butterfly{
  position:absolute; font-size:20px; z-index:4;
  animation: fly linear infinite;
}
@keyframes fly{
  0%{ transform: translate(-10vw, 80vh) rotate(0deg) scale(0.5); opacity:0 }
  10%{ opacity:1 }
  25%{ transform: translate(20vw, 60vh) rotate(20deg) scale(1) }
  50%{ transform: translate(50vw, 40vh) rotate(-10deg) scale(1.1) }
  75%{ transform: translate(80vw, 65vh) rotate(15deg) scale(0.9) }
  100%{ transform: translate(110vw, 30vh) rotate(0deg) scale(0.5); opacity:0 }
}

/* Ful */
.flowers{
  position:absolute; bottom:0; width:100%; height:80px; z-index:4;
  display:flex; justify-content:space-around; align-items:flex-end; padding:0 20px;
  font-size:24px; filter: drop-shadow(0 0 5px #ff4d6d);
}
.next-btn{
  margin-top:30px; padding:12px 40px; background: rgba(255,77,109,0.15);
  border:1px solid #ff8fa3; color:#ffd6e0; border-radius:30px; 
  letter-spacing:3px; font-family:sans-serif; font-size:14px;
  backdrop-filter: blur(10px); cursor:pointer; text-decoration:none;
  display:inline-block; animation: fadeUp 2s ease-out 1s both;
  transition:0.3s; box-shadow: 0 0 15px rgba(255,77,109,0.3);
}
.next-btn:hover{ background:#ff4d6d; color:white; box-shadow:0 0 25px #ff4d6d; transform:scale(1.05) }
</style>
</head>
<body>
<div class="sky"></div>
<div class="stars"></div>
<div class="moon"></div>
<div class="mountain2"></div>
<div class="mountain"></div>

<!-- Pahare bosa couple -->
<div class="couple"><div class="couple-heads"></div></div>

<!-- Projapoti gula -->
<div class="butterfly" style="animation-duration:12s; animation-delay:0s; top:0;">🦋</div>
<div class="butterfly" style="animation-duration:15s; animation-delay:2s; top:10%; font-size:16px;">🦋</div>
<div class="butterfly" style="animation-duration:11s; animation-delay:4s; top:5%;">🦋</div>
<div class="butterfly" style="animation-duration:14s; animation-delay:1s; top:15%; font-size:18px;">🦋</div>
<div class="butterfly" style="animation-duration:13s; animation-delay:3s; top:20%;">🦋</div>

<div class="flowers">
  <span>🌸</span><span>🌷</span><span>🌺</span><span>🌸</span><span>🌷</span><span>🌹</span><span>🌸</span><span>🌺</span><span>🌷</span><span>🌸</span>
</div>

<div class="content">
  <h1>Mawya</h1>
  <p>YOU & ME ON A MOUNTAIN NIGHT</p>
  <a href="next.html" class="next-btn">NEXT →</a>
</div>

<script>
// aro projapoti auto
setInterval(()=>{
  let b = document.createElement('div');
  b.className='butterfly'; b.innerHTML='🦋';
  b.style.top = Math.random()*60+'%';
  b.style.animationDuration = (10+Math.random()*6)+'s';
  document.body.appendChild(b);
  setTimeout(()=>b.remove(),12000);
}, 2000);
</script>
</body>
</html>
